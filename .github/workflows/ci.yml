name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    name: build (Rocq ${{ matrix.rocq_version }}, Dune ${{ matrix.dune_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream released Rocq packages still constrain Dune to < 3.24.
          # Exercise our lower bound once and the newest pre-removal Dune
          # elsewhere.
          - rocq_version: '9.0'
            dune_version: '3.21.0'
          - rocq_version: '9.1'
            dune_version: '3.23.1'
          - rocq_version: '9.2'
            dune_version: '3.23.1'
          # Rocq dev and its stdlib use the rocq build language, so this lane
          # directly checks the Dune release that deleted the coq extension.
          - rocq_version: 'dev'
            dune_version: '3.24.0'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: rocq-prover/docker-opam-action@master
        with:
          # The action retains its historical input name.
          coq_version: ${{ matrix.rocq_version }}
          before_install: |
            startGroup "Fix workspace permissions"
              sudo chown -R $(id -u):$(id -g) .
              git config --global --add safe.directory /github/workspace
            endGroup
            startGroup "Print opam config"
              opam config list; opam repo list; opam list
            endGroup
            startGroup "Pin Dune ${{ matrix.dune_version }}"
              opam update
              opam pin add -k version -y dune "${{ matrix.dune_version }}"
            endGroup
          script: |
            startGroup "Tool versions"
              opam exec -- dune --version
              opam exec -- rocq --version
            endGroup
            startGroup "Build"
              opam exec -- dune build
            endGroup
            startGroup "Check generated opam metadata"
              git diff --exit-code -- rocq-read-file.opam
              opam lint rocq-read-file.opam
            endGroup
            startGroup "Install"
              opam exec -- dune install -p rocq-read-file
            endGroup
            startGroup "Perf tests"
              opam exec -- dune build --root tests/perf
            endGroup
          uninstall: ''

  check-all:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
    - run: echo 'All builds passed'
      if: ${{ needs.build.result == 'success' }}
    - run: echo 'Some builds failed' && false
      if: ${{ needs.build.result != 'success' }}
